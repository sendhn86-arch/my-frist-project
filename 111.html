<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101713">
  <title>贪吃蛇</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d120f;
      --panel: #151d18;
      --panel-2: #1c2720;
      --text: #f3f7f4;
      --muted: #9eada3;
      --green: #78e08f;
      --green-dark: #3ebd66;
      --food: #ff7b72;
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(71, 150, 92, 0.18), transparent 34rem),
        var(--bg);
    }

    button {
      font: inherit;
    }

    .game-card {
      width: min(94vw, 590px);
      padding: clamp(16px, 4vw, 24px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(21, 29, 24, 0.94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(14px);
    }

    .topbar,
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2rem);
      letter-spacing: -0.04em;
    }

    .score-box {
      min-width: 108px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      background: var(--panel-2);
    }

    #score {
      margin-left: 6px;
      color: var(--green);
      font-size: 1.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      margin: 18px 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      background: #0f1712;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.28);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 30px;
      text-align: center;
      background: rgba(7, 11, 8, 0.56);
      backdrop-filter: blur(3px);
      transition: opacity 160ms ease;
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay strong {
      font-size: clamp(1.5rem, 6vw, 2.3rem);
    }

    .overlay span {
      max-width: 300px;
      color: #bdc9c0;
      line-height: 1.55;
    }

    .actions {
      justify-content: center;
    }

    .action-btn {
      min-width: 122px;
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      color: #07100a;
      font-weight: 800;
      cursor: pointer;
      background: var(--green);
      box-shadow: 0 8px 22px rgba(62, 189, 102, 0.2);
      transition: transform 120ms ease, filter 120ms ease;
    }

    .action-btn.secondary {
      color: var(--text);
      background: #29372e;
      box-shadow: none;
    }

    .action-btn:hover {
      filter: brightness(1.07);
    }

    .action-btn:active,
    .control-btn:active {
      transform: scale(0.96);
    }

    .action-btn:focus-visible,
    .control-btn:focus-visible {
      outline: 3px solid rgba(120, 224, 143, 0.4);
      outline-offset: 2px;
    }

    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
      text-align: center;
    }

    .mobile-controls {
      display: none;
      width: 174px;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 54px);
      gap: 6px;
      margin: 18px auto 0;
      user-select: none;
    }

    .control-btn {
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      font-size: 1.35rem;
      cursor: pointer;
      background: var(--panel-2);
      transition: transform 80ms ease, background 80ms ease;
      touch-action: manipulation;
    }

    .control-btn[data-dir="up"] { grid-column: 2; }
    .control-btn[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .control-btn[data-dir="down"] { grid-column: 2; grid-row: 2; }
    .control-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (hover: none), (pointer: coarse), (max-width: 640px) {
      body { place-items: start center; }
      .mobile-controls { display: grid; }
      .game-card { border-radius: 20px; }
      .hint .desktop-only { display: none; }
    }

    @media (max-height: 720px) and (orientation: landscape) {
      body { place-items: center; }
      .game-card {
        width: min(94vw, 920px);
        display: grid;
        grid-template-columns: minmax(280px, 1fr) 210px;
        column-gap: 22px;
      }
      .topbar { grid-column: 1 / -1; }
      .board-wrap { grid-row: 2 / span 4; margin-bottom: 0; }
      .mobile-controls { align-self: end; }
      .actions { align-self: center; flex-direction: column; }
      .hint { align-self: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="game-card">
    <header class="topbar">
      <h1>贪吃蛇</h1>
      <div class="score-box" aria-live="polite">分数 <span id="score">0</span></div>
    </header>

    <section class="board-wrap" id="boardWrap" aria-label="贪吃蛇游戏区域">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay" id="overlay">
        <strong id="overlayTitle">准备好了吗？</strong>
        <span id="overlayText">吃掉果实，别撞到墙壁或自己。</span>
      </div>
    </section>

    <div class="actions">
      <button class="action-btn" id="startBtn" type="button">开始游戏</button>
      <button class="action-btn secondary" id="restartBtn" type="button">重新开始</button>
    </div>

    <div class="mobile-controls" aria-label="触控方向键">
      <button class="control-btn" data-dir="up" type="button" aria-label="向上">▲</button>
      <button class="control-btn" data-dir="left" type="button" aria-label="向左">◀</button>
      <button class="control-btn" data-dir="down" type="button" aria-label="向下">▼</button>
      <button class="control-btn" data-dir="right" type="button" aria-label="向右">▶</button>
    </div>

    <p class="hint">
      <span class="desktop-only">方向键或 WASD 控制方向</span>
      <span>手机可滑动游戏区域或点击方向键</span>
    </p>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const boardWrap = document.getElementById('boardWrap');
      const scoreEl = document.getElementById('score');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');

      const GRID_SIZE = 20;
      const MOVE_INTERVAL = 115;
      const DIRECTIONS = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake = [];
      let food = { x: 14, y: 10 };
      let direction = { ...DIRECTIONS.right };
      let nextDirection = { ...DIRECTIONS.right };
      let score = 0;
      let gameState = 'idle';
      let lastMoveTime = 0;
      let animationId = 0;
      let touchStart = null;

      function resetGame() {
        snake = [
          { x: 7, y: 10 },
          { x: 6, y: 10 },
          { x: 5, y: 10 },
          { x: 4, y: 10 }
        ];
        direction = { ...DIRECTIONS.right };
        nextDirection = { ...DIRECTIONS.right };
        score = 0;
        scoreEl.textContent = '0';
        food = createFood();
        lastMoveTime = 0;
        draw();
      }

      function createFood() {
        const freeCells = [];
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            if (!snake.some(segment => segment.x === x && segment.y === y)) {
              freeCells.push({ x, y });
            }
          }
        }
        return freeCells[Math.floor(Math.random() * freeCells.length)] || { x: -1, y: -1 };
      }

      function beginGame(forceReset = false) {
        if (forceReset || gameState === 'over') resetGame();
        gameState = 'running';
        overlay.hidden = true;
        startBtn.textContent = '游戏中';
        startBtn.disabled = true;
        lastMoveTime = performance.now();
        cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(gameLoop);
      }

      function endGame() {
        gameState = 'over';
        cancelAnimationFrame(animationId);
        overlayTitle.textContent = '游戏结束';
        overlayText.textContent = `最终得分：${score}。点击“重新开始”再来一局。`;
        overlay.hidden = false;
        startBtn.textContent = '开始游戏';
        startBtn.disabled = false;
        if (navigator.vibrate) navigator.vibrate(120);
      }

      function setDirection(newDirection) {
        if (!newDirection) return;
        const isOpposite = newDirection.x + direction.x === 0 && newDirection.y + direction.y === 0;
        if (!isOpposite) nextDirection = { ...newDirection };
      }

      function update() {
        direction = { ...nextDirection };
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };

        const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID_SIZE || head.y >= GRID_SIZE;
        const willEat = head.x === food.x && head.y === food.y;
        const bodyToCheck = willEat ? snake : snake.slice(0, -1);
        const hitBody = bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y);

        if (hitWall || hitBody) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (willEat) {
          score += 10;
          scoreEl.textContent = String(score);
          food = createFood();
        } else {
          snake.pop();
        }
      }

      function gameLoop(timestamp) {
        if (gameState !== 'running') return;
        if (timestamp - lastMoveTime >= MOVE_INTERVAL) {
          update();
          lastMoveTime = timestamp;
        }
        draw();
        if (gameState === 'running') animationId = requestAnimationFrame(gameLoop);
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, r);
      }

      function draw() {
        const cssSize = boardWrap.clientWidth;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetSize = Math.round(cssSize * dpr);
        if (canvas.width !== targetSize || canvas.height !== targetSize) {
          canvas.width = targetSize;
          canvas.height = targetSize;
        }

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssSize, cssSize);
        ctx.fillStyle = '#0f1712';
        ctx.fillRect(0, 0, cssSize, cssSize);

        const cell = cssSize / GRID_SIZE;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID_SIZE; i++) {
          const p = Math.round(i * cell) + 0.5;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, cssSize);
          ctx.moveTo(0, p);
          ctx.lineTo(cssSize, p);
          ctx.stroke();
        }

        const foodCenterX = (food.x + 0.5) * cell;
        const foodCenterY = (food.y + 0.5) * cell;
        ctx.fillStyle = '#ff7b72';
        ctx.shadowColor = 'rgba(255, 123, 114, 0.65)';
        ctx.shadowBlur = cell * 0.45;
        ctx.beginPath();
        ctx.arc(foodCenterX, foodCenterY, cell * 0.31, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        snake.forEach((segment, index) => {
          const gap = Math.max(1.5, cell * 0.09);
          const x = segment.x * cell + gap;
          const y = segment.y * cell + gap;
          const size = cell - gap * 2;
          ctx.fillStyle = index === 0 ? '#94f2a9' : `hsl(134 62% ${Math.max(42, 58 - index * 0.7)}%)`;
          roundedRect(x, y, size, size, cell * 0.23);
          ctx.fill();

          if (index === 0) drawEyes(x, y, size, cell);
        });
      }

      function drawEyes(x, y, size, cell) {
        const forward = direction;
        const side = { x: -forward.y, y: forward.x };
        const centerX = x + size / 2 + forward.x * cell * 0.13;
        const centerY = y + size / 2 + forward.y * cell * 0.13;
        const offset = cell * 0.16;
        ctx.fillStyle = '#0b160e';
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(centerX + side.x * offset * sign, centerY + side.y * offset * sign, Math.max(1.2, cell * 0.055), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const keyToDirection = {
        ArrowUp: DIRECTIONS.up,
        w: DIRECTIONS.up,
        W: DIRECTIONS.up,
        ArrowDown: DIRECTIONS.down,
        s: DIRECTIONS.down,
        S: DIRECTIONS.down,
        ArrowLeft: DIRECTIONS.left,
        a: DIRECTIONS.left,
        A: DIRECTIONS.left,
        ArrowRight: DIRECTIONS.right,
        d: DIRECTIONS.right,
        D: DIRECTIONS.right
      };

      window.addEventListener('keydown', event => {
        const requestedDirection = keyToDirection[event.key];
        if (!requestedDirection) return;
        event.preventDefault();
        if (gameState === 'idle') beginGame();
        setDirection(requestedDirection);
      }, { passive: false });

      document.querySelectorAll('.control-btn').forEach(button => {
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          if (gameState === 'idle') beginGame();
          setDirection(DIRECTIONS[button.dataset.dir]);
        });
      });

      boardWrap.addEventListener('pointerdown', event => {
        touchStart = { x: event.clientX, y: event.clientY };
      });

      boardWrap.addEventListener('pointerup', event => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (gameState === 'idle') beginGame();
        setDirection(Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? DIRECTIONS.right : DIRECTIONS.left)
          : (dy > 0 ? DIRECTIONS.down : DIRECTIONS.up));
      });

      boardWrap.addEventListener('pointercancel', () => { touchStart = null; });
      startBtn.addEventListener('click', () => beginGame(gameState === 'over'));
      restartBtn.addEventListener('click', () => beginGame(true));
      window.addEventListener('resize', draw);

      resetGame();
    })();
  </script>
</body>
</html>
